<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

    <h:head>
        <title>Logout - E-Business System</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>
        <main class="auth-container">
            <section class="auth-card">

                <div class="auth-brand">
                    <h2>E-Business System</h2>
                    <p>Secure Session Logout</p>
                </div>

                <h1 class="auth-title">You Have Logged Out</h1>

                <p class="auth-subtitle">
                    Your session has ended. Please log in again to access the e-business system.
                </p>

                <div class="auth-links">
                    <h:link outcome="login" value="Return to Login" />
                    <span>|</span>
                    <h:link outcome="index" value="Welcome Page" />
                </div>

            </section>
        </main>
    </h:body>

</html>
