<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewParam name="customerId" value="#{customerBean.selectedCustomerId}" />
    </f:metadata>

    <h:head>
        <title>Customer profile | SmartTech</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>
        <main class="app-container">
            <header class="app-header">
                <div>
                    <h1>SmartTech</h1>
                    <p>Customer records</p>
                </div>

                <nav class="app-nav" aria-label="Customer navigation">
                    <h:link outcome="main" value="Dashboard" />
                    <h:link outcome="listCustomers" value="Customers" />
                    <h:link outcome="searchCustomer" value="Search" />
                    <h:form styleClass="logout-form">
                        <h:commandLink value="Sign out"
                                       action="#{authenticationBean.logout}"
                                       styleClass="nav-command-link" />
                    </h:form>
                </nav>
            </header>

            <section class="content-card">
                <div class="section-heading">
                    <h2>Customer profile</h2>
                    <p>Review customer contact information for the selected customer.</p>
                </div>

                <div class="details-grid">
                    <div class="details-item">
                        <span class="details-label">Customer ID</span>
                        <span class="details-value"><h:outputText value="#{customerBean.selectedCustomer.customerId}" /></span>
                    </div>
                    <div class="details-item">
                        <span class="details-label">Full name</span>
                        <span class="details-value"><h:outputText value="#{customerBean.selectedCustomer.firstName} #{customerBean.selectedCustomer.lastName}" /></span>
                    </div>
                    <div class="details-item">
                        <span class="details-label">Email address</span>
                        <span class="details-value"><h:outputText value="#{customerBean.selectedCustomer.emailAddress}" /></span>
                    </div>
                    <div class="details-item">
                        <span class="details-label">Phone number</span>
                        <span class="details-value"><h:outputText value="#{customerBean.selectedCustomer.phoneNumber}" /></span>
                    </div>
                    <div class="details-item details-full">
                        <span class="details-label">Address</span>
                        <span class="details-value"><h:outputText value="#{customerBean.selectedCustomer.address}" /></span>
                    </div>
                </div>

                <div class="page-actions">
                    <h:link outcome="listCustomers"
                            value="Back to customers"
                            styleClass="secondary-button" />
                </div>
            </section>
        </main>
    </h:body>
</html>
