<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

    <h:head>
        <title>E-Business System</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </h:head>

    <h:body>
        <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 80px auto; text-align: center;">

            <h1>E-Business: Login, Logout and Registration</h1>

            <p>
                Welcome to the COIT20259 Assignment 2 e-business system.
            </p>

            <div style="margin-top: 30px;">
                <h:link outcome="login" value="Login"
                        style="display: inline-block; margin: 10px; padding: 12px 24px;
                               background-color: #2563eb; color: white; text-decoration: none;
                               border-radius: 6px;" />

                <h:link outcome="register" value="Registration"
                        style="display: inline-block; margin: 10px; padding: 12px 24px;
                               background-color: #16a34a; color: white; text-decoration: none;
                               border-radius: 6px;" />
            </div>

        </div>
    </h:body>

</html>
