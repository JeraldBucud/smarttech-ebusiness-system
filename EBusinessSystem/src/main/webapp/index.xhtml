<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

    <h:head>
        <title>Welcome - E-Business System</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>
        <main class="landing-container">

            <section class="landing-card">

                <div class="landing-content">
                    <p class="landing-label">COIT20259 Assignment 2</p>

                    <h1>E-Business System</h1>

                    <p class="landing-subtitle">
                        A secured enterprise system for managing tablets, smartwatches,
                        customers, and customer orders.
                    </p>

                    <div class="landing-actions">
                        <h:link outcome="login"
                                value="Login"
                                styleClass="primary-link-button" />

                        <h:link outcome="register"
                                value="Registration"
                                styleClass="secondary-link-button" />
                    </div>
                </div>

            </section>

        </main>
    </h:body>

</html>
