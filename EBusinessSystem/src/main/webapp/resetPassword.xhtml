<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

    <h:head>
        <title>Reset Password - E-Business System</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>
        <main class="auth-container">
            <section class="auth-card">

                <div class="auth-brand">
                    <h2>E-Business System</h2>
                    <p>Password Reset Portal</p>
                </div>

                <h1 class="auth-title">Reset Your Password</h1>

                <p class="auth-subtitle">
                    Enter the recovery code sent to your email address and create a new password.
                </p>

                <h:form styleClass="auth-form">

                    <div class="form-group">
                        <h:outputLabel for="recoveryCode"
                                       value="Recovery Code"
                                       styleClass="form-label" />

                        <h:inputText id="recoveryCode"
                                     value="#{authenticationBean.recoveryCode}"
                                     required="true"
                                     requiredMessage="Recovery code is required."
                                     styleClass="form-input" />

                        <h:message for="recoveryCode" styleClass="form-error" />
                    </div>

                    <div class="form-group">
                        <h:outputLabel for="newPassword"
                                       value="New Password"
                                       styleClass="form-label" />

                        <h:inputSecret id="newPassword"
                                       value="#{authenticationBean.newPassword}"
                                       required="true"
                                       requiredMessage="New password is required."
                                       styleClass="form-input" />

                        <h:message for="newPassword" styleClass="form-error" />
                    </div>

                    <div class="form-group">
                        <h:outputLabel for="confirmPassword"
                                       value="Confirm New Password"
                                       styleClass="form-label" />

                        <h:inputSecret id="confirmPassword"
                                       value="#{authenticationBean.confirmPassword}"
                                       required="true"
                                       requiredMessage="Password confirmation is required."
                                       styleClass="form-input" />

                        <h:message for="confirmPassword" styleClass="form-error" />
                    </div>

                    <div class="form-actions">
                        <h:commandButton value="Reset Password"
                                         action="#{authenticationBean.resetPassword}"
                                         styleClass="primary-button" />
                    </div>

                </h:form>

                <div class="auth-links">
                    <h:link outcome="recoverAccount" value="Back to Account Recovery" />
                    <span>|</span>
                    <h:link outcome="login" value="Go to Login" />
                </div>

            </section>
        </main>
    </h:body>

</html>
