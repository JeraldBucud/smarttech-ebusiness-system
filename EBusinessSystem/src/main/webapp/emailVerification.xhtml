<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

    <h:head>
        <title>Email Verification - E-Business System</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>
        <main class="auth-container">
            <section class="auth-card">

                <div class="auth-brand">
                    <h2>E-Business System</h2>
                    <p>Email Verification Portal</p>
                </div>

                <h1 class="auth-title">Verify Your Email</h1>

                <p class="auth-subtitle">
                    Enter the verification code sent to your email address to complete your registration.
                </p>

                <h:form styleClass="auth-form">

                    <div class="form-group">
                        <h:outputLabel for="verificationCode"
                                       value="Verification Code"
                                       styleClass="form-label" />

                        <h:inputText id="verificationCode"
                                     required="true"
                                     requiredMessage="Verification code is required."
                                     styleClass="form-input" />

                        <h:message for="verificationCode" styleClass="form-error" />
                    </div>

                    <div class="form-actions">
                        <h:commandButton value="Verify Account" styleClass="primary-button" />
                    </div>

                </h:form>

                <div class="auth-links">
                    <h:link outcome="register" value="Back to Registration" />
                    <span>|</span>
                    <h:link outcome="login" value="Go to Login" />
                </div>

            </section>
        </main>
    </h:body>

</html>
