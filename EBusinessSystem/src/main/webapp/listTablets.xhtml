<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

    <h:head>
        <title>Tablet Stock - E-Business System</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>
        <main class="app-container">

            <header class="app-header">
                <div>
                    <h1>E-Business System</h1>
                    <p>Tablet Product Stock</p>
                </div>

                <nav class="app-nav">
                    <h:link outcome="main" value="Dashboard" />
                    <h:link outcome="createTablet" value="Create Tablet" />
                    <h:link outcome="createSmartwatch" value="Create Smartwatch" />
                    <h:link outcome="login" value="Logout" />
                </nav>
            </header>

            <section class="content-card">

                <div class="section-heading">
                    <h2>Tablet Stock List</h2>
                    <p>
                        View tablet product records and stock details saved in the e-business system.
                    </p>
                </div>

                <h:form styleClass="data-form">

                    <h:messages globalOnly="true" styleClass="form-error" />

                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Brand</th>
                                    <th>Model</th>
                                    <th>Display Size</th>
                                    <th>Storage</th>
                                    <th>Stylus Support</th>
                                    <th>Battery</th>
                                    <th>Stock</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr>
                                    <td>Sample Brand</td>
                                    <td>Sample Tablet Model</td>
                                    <td>11 inch</td>
                                    <td>128 GB</td>
                                    <td>Yes</td>
                                    <td>8000 mAh</td>
                                    <td>100</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </h:form>

            </section>

        </main>
    </h:body>

</html>
