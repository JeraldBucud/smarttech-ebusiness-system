<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Search customers | SmartTech</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>
        <main class="app-container">
            <header class="app-header">
                <div>
                    <h1>SmartTech</h1>
                    <p>Customer records</p>
                </div>

                <nav class="app-nav" aria-label="Customer navigation">
                    <h:link outcome="main" value="Dashboard" />
                    <h:link outcome="createCustomer" value="Add customer" />
                    <h:link outcome="listCustomers" value="Customers" />
                    <h:form styleClass="logout-form">
                        <h:commandLink value="Sign out"
                                       action="#{authenticationBean.logout}"
                                       styleClass="nav-command-link" />
                    </h:form>
                </nav>
            </header>

            <section class="content-card">
                <div class="section-heading">
                    <h2>Search customer records</h2>
                    <p>Find customers using an ID, name, email address, phone number or address.</p>
                </div>

                <h:form styleClass="data-form">
                    <h:messages globalOnly="true" styleClass="form-error" />
                    <div class="search-bar">
                        <div class="form-group search-input-group">
                            <h:outputLabel for="searchKeyword" value="Search keyword" styleClass="form-label" />
                            <h:inputText id="searchKeyword"
                                         value="#{customerBean.searchKeyword}"
                                         required="true"
                                         requiredMessage="Search keyword is required."
                                         styleClass="form-input" />
                            <h:message for="searchKeyword" styleClass="form-error" />
                        </div>
                        <div class="search-action">
                            <h:commandButton value="Search customers"
                                             action="#{customerBean.searchCustomer}"
                                             styleClass="primary-button" />
                        </div>
                    </div>

                    <div class="table-wrapper">
                        <h:dataTable value="#{customerBean.filteredCustomerRows}"
                                     var="customer"
                                     styleClass="data-table">
                            <h:column><f:facet name="header">Customer ID</f:facet><h:outputText value="#{customer.customerId}" /></h:column>
                            <h:column><f:facet name="header">First name</f:facet><h:outputText value="#{customer.firstName}" /></h:column>
                            <h:column><f:facet name="header">Last name</f:facet><h:outputText value="#{customer.lastName}" /></h:column>
                            <h:column><f:facet name="header">Email address</f:facet><h:outputText value="#{customer.emailAddress}" /></h:column>
                            <h:column><f:facet name="header">Phone number</f:facet><h:outputText value="#{customer.phoneNumber}" /></h:column>
                            <h:column><f:facet name="header">Address</f:facet><h:outputText value="#{customer.address}" /></h:column>
                            <h:column>
                                <f:facet name="header">Profile</f:facet>
                                <h:link outcome="customerDetails" value="View profile">
                                    <f:param name="customerId" value="#{customer.customerId}" />
                                </h:link>
                            </h:column>
                        </h:dataTable>
                    </div>
                </h:form>
            </section>
        </main>
    </h:body>
</html>
