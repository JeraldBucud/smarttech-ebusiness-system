<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Search Customer - E-Business System</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>
        <main class="app-container">

            <header class="app-header">
                <div>
                    <h1>E-Business System</h1>
                    <p>Customer Search</p>
                </div>

                <nav class="app-nav">
                    <h:link outcome="main" value="Dashboard" />
                    <h:link outcome="createCustomer" value="Create Customer" />
                    <h:link outcome="listCustomers" value="List Customers" />
                    <h:form styleClass="logout-form">
                        <h:commandLink value="Logout"
                                       action="#{authenticationBean.logout}"
                                       styleClass="nav-command-link" />
                    </h:form>
                </nav>
            </header>

            <section class="content-card">

                <div class="section-heading">
                    <h2>Search Customer</h2>
                    <p>
                        Search customer records by customer ID, name, email address, or phone number.
                    </p>
                </div>

                <h:form styleClass="data-form">

                    <h:messages globalOnly="true" styleClass="form-error" />

                    <div class="search-bar">
                        <div class="form-group search-input-group">
                            <h:outputLabel for="searchKeyword"
                                           value="Search Keyword"
                                           styleClass="form-label" />

                            <h:inputText id="searchKeyword"
                                         value="#{customerBean.searchKeyword}"
                                         required="true"
                                         requiredMessage="Search keyword is required."
                                         styleClass="form-input" />

                            <h:message for="searchKeyword" styleClass="form-error" />
                        </div>

                        <div class="search-action">
                            <h:commandButton value="Search Customer"
                                             action="#{customerBean.searchCustomer}"
                                             styleClass="primary-button" />
                        </div>
                    </div>

                                        <div class="table-wrapper">
                        <h:dataTable value="#{customerBean.customerRows}"
                                     var="customer"
                                     styleClass="data-table">

                            <h:column>
                                <f:facet name="header">Customer ID</f:facet>
                                <h:outputText value="#{customer.customerId}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">First Name</f:facet>
                                <h:outputText value="#{customer.firstName}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Last Name</f:facet>
                                <h:outputText value="#{customer.lastName}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Email Address</f:facet>
                                <h:outputText value="#{customer.emailAddress}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Phone Number</f:facet>
                                <h:outputText value="#{customer.phoneNumber}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Address</f:facet>
                                <h:outputText value="#{customer.address}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Details</f:facet>
                                <h:link outcome="customerDetails" value="View Details" />
                            </h:column>

                        </h:dataTable>
                    </div>

                </h:form>

            </section>

        </main>
    </h:body>

</html>
