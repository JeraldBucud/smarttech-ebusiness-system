<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Search Tablet - E-Business System</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>
        <main class="app-container">

            <header class="app-header">
                <div>
                    <h1>E-Business System</h1>
                    <p>Tablet Product Search</p>
                </div>

                <nav class="app-nav">
                    <h:link outcome="main" value="Dashboard" />
                    <h:link outcome="createTablet" value="Create Tablet" />
                    <h:link outcome="listTablets" value="Tablet Stock" />
                    <h:form styleClass="logout-form">
                        <h:commandLink value="Logout"
                                       action="#{authenticationBean.logout}"
                                       styleClass="nav-command-link" />
                    </h:form>
                </nav>
            </header>

            <section class="content-card">

                <div class="section-heading">
                    <h2>Search Tablet</h2>
                    <p>
                        Search tablet products by brand, model, or other product details.
                    </p>
                </div>

                <h:form styleClass="data-form">

                    <h:messages globalOnly="true" styleClass="form-error" />

                    <div class="search-bar">
                        <div class="form-group search-input-group">
                            <h:outputLabel for="searchKeyword"
                                           value="Search Keyword"
                                           styleClass="form-label" />

                            <h:inputText id="searchKeyword"
                                         value="#{tabletBean.searchKeyword}"
                                         required="true"
                                         requiredMessage="Search keyword is required."
                                         styleClass="form-input" />

                            <h:message for="searchKeyword" styleClass="form-error" />
                        </div>

                        <div class="search-action">
                            <h:commandButton value="Search Tablet"
                                             action="#{tabletBean.searchTablet}"
                                             styleClass="primary-button" />
                        </div>
                    </div>

                                        <div class="table-wrapper">
                        <h:dataTable value="#{tabletBean.filteredTabletRows}"
                                     var="tablet"
                                     styleClass="data-table">

                            <h:column>
                                <f:facet name="header">Brand</f:facet>
                                <h:outputText value="#{tablet.brand}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Model</f:facet>
                                <h:outputText value="#{tablet.model}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Display Size</f:facet>
                                <h:outputText value="#{tablet.displaySize}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Storage</f:facet>
                                <h:outputText value="#{tablet.storageCapacity}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Stylus Support</f:facet>
                                <h:outputText value="#{tablet.stylusSupport}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Battery</f:facet>
                                <h:outputText value="#{tablet.batteryCapacity}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Stock</f:facet>
                                <h:outputText value="#{tablet.stockQuantity}" />
                            </h:column>

                        </h:dataTable>
                    </div>

                </h:form>

            </section>

        </main>
    </h:body>

</html>
