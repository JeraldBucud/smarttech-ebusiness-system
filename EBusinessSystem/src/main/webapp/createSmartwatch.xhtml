<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

    <h:head>
        <title>Create Smartwatch - E-Business System</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>
        <main class="app-container">

            <header class="app-header">
                <div>
                    <h1>E-Business System</h1>
                    <p>Smartwatch Product Management</p>
                </div>

                <nav class="app-nav">
                    <h:link outcome="main" value="Dashboard" />
                    <h:link outcome="createTablet" value="Tablet" />
                    <h:form styleClass="logout-form">
                        <h:commandLink value="Logout"
                                       action="#{authenticationBean.logout}"
                                       styleClass="nav-command-link" />
                    </h:form>
                </nav>
            </header>

            <section class="content-card">

                <div class="section-heading">
                    <h2>Create Smartwatch</h2>
                    <p>
                        Enter the smartwatch product details to prepare the product record for persistence.
                    </p>
                </div>

                <h:form styleClass="data-form">

                    <h:messages globalOnly="true" styleClass="form-error" />

                    <div class="form-grid">

                        <div class="form-group">
                            <h:outputLabel for="brand" value="Brand" styleClass="form-label" />
                            <h:inputText id="brand"
                                         required="true"
                                         requiredMessage="Brand is required."
                                         styleClass="form-input" />
                            <h:message for="brand" styleClass="form-error" />
                        </div>

                        <div class="form-group">
                            <h:outputLabel for="model" value="Model" styleClass="form-label" />
                            <h:inputText id="model"
                                         required="true"
                                         requiredMessage="Model is required."
                                         styleClass="form-input" />
                            <h:message for="model" styleClass="form-error" />
                        </div>

                        <div class="form-group">
                            <h:outputLabel for="displaySize" value="Display Size" styleClass="form-label" />
                            <h:inputText id="displaySize"
                                         required="true"
                                         requiredMessage="Display size is required."
                                         styleClass="form-input" />
                            <h:message for="displaySize" styleClass="form-error" />
                        </div>

                        <div class="form-group">
                            <h:outputLabel for="weight" value="Weight" styleClass="form-label" />
                            <h:inputText id="weight"
                                         required="true"
                                         requiredMessage="Weight is required."
                                         styleClass="form-input" />
                            <h:message for="weight" styleClass="form-error" />
                        </div>

                        <div class="form-group">
                            <h:outputLabel for="operatingSystem" value="Operating System" styleClass="form-label" />
                            <h:inputText id="operatingSystem"
                                         required="true"
                                         requiredMessage="Operating system is required."
                                         styleClass="form-input" />
                            <h:message for="operatingSystem" styleClass="form-error" />
                        </div>

                        <div class="form-group">
                            <h:outputLabel for="connectivity" value="Connectivity" styleClass="form-label" />
                            <h:inputText id="connectivity"
                                         required="true"
                                         requiredMessage="Connectivity is required."
                                         styleClass="form-input" />
                            <h:message for="connectivity" styleClass="form-error" />
                        </div>

                        <div class="form-group">
                            <h:outputLabel for="wifiCapability" value="Wi-Fi Capability" styleClass="form-label" />
                            <h:inputText id="wifiCapability"
                                         required="true"
                                         requiredMessage="Wi-Fi capability is required."
                                         styleClass="form-input" />
                            <h:message for="wifiCapability" styleClass="form-error" />
                        </div>

                        <div class="form-group">
                            <h:outputLabel for="healthMonitoring" value="Health Monitoring" styleClass="form-label" />
                            <h:inputText id="healthMonitoring"
                                         required="true"
                                         requiredMessage="Health monitoring feature is required."
                                         styleClass="form-input" />
                            <h:message for="healthMonitoring" styleClass="form-error" />
                        </div>

                        <div class="form-group">
                            <h:outputLabel for="fitnessTracking" value="Fitness Tracking" styleClass="form-label" />
                            <h:inputText id="fitnessTracking"
                                         required="true"
                                         requiredMessage="Fitness tracking feature is required."
                                         styleClass="form-input" />
                            <h:message for="fitnessTracking" styleClass="form-error" />
                        </div>

                        <div class="form-group">
                            <h:outputLabel for="wearableConnectivity" value="Wearable Connectivity" styleClass="form-label" />
                            <h:inputText id="wearableConnectivity"
                                         required="true"
                                         requiredMessage="Wearable connectivity is required."
                                         styleClass="form-input" />
                            <h:message for="wearableConnectivity" styleClass="form-error" />
                        </div>

                        <div class="form-group">
                            <h:outputLabel for="stockQuantity" value="Stock Quantity" styleClass="form-label" />
                            <h:inputText id="stockQuantity"
                                         required="true"
                                         requiredMessage="Stock quantity is required."
                                         styleClass="form-input" />
                            <h:message for="stockQuantity" styleClass="form-error" />
                        </div>

                    </div>

                    <div class="form-actions">
                        <h:commandButton value="Create Smartwatch"
                                         styleClass="primary-button" />
                    </div>

                </h:form>

            </section>

        </main>
    </h:body>

</html>
