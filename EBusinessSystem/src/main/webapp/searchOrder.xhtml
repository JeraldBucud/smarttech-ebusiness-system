<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Search Order - E-Business System</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>
        <main class="app-container">

            <header class="app-header">
                <div>
                    <h1>E-Business System</h1>
                    <p>Customer Order Search</p>
                </div>

                <nav class="app-nav">
                    <h:link outcome="main" value="Dashboard" />
                    <h:link outcome="createOrder" value="Create Order" />
                    <h:link outcome="listOrders" value="List Orders" />
                    <h:form styleClass="logout-form">
                        <h:commandLink value="Logout"
                                       action="#{authenticationBean.logout}"
                                       styleClass="nav-command-link" />
                    </h:form>
                </nav>
            </header>

            <section class="content-card">

                <div class="section-heading">
                    <h2>Search Order</h2>
                    <p>
                        Search customer orders by order ID, customer name, product type, or product model.
                    </p>
                </div>

                <h:form styleClass="data-form">

                    <h:messages globalOnly="true" styleClass="form-error" />

                    <div class="search-bar">
                        <div class="form-group search-input-group">
                            <h:outputLabel for="searchKeyword"
                                           value="Search Keyword"
                                           styleClass="form-label" />

                            <h:inputText id="searchKeyword"
                                         value="#{orderBean.searchKeyword}"
                                         required="true"
                                         requiredMessage="Search keyword is required."
                                         styleClass="form-input" />

                            <h:message for="searchKeyword" styleClass="form-error" />
                        </div>

                        <div class="search-action">
                            <h:commandButton value="Search Order"
                                             action="#{orderBean.searchOrder}"
                                             styleClass="primary-button" />
                        </div>
                    </div>

                                        <div class="table-wrapper">
                        <h:dataTable value="#{orderBean.orderRows}"
                                     var="order"
                                     styleClass="data-table">

                            <h:column>
                                <f:facet name="header">Order ID</f:facet>
                                <h:outputText value="#{order.orderId}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Customer</f:facet>
                                <h:outputText value="#{order.customerName}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Product Type</f:facet>
                                <h:outputText value="#{order.productType}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Product Model</f:facet>
                                <h:outputText value="#{order.productModel}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Quantity</f:facet>
                                <h:outputText value="#{order.quantity}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Status</f:facet>
                                <h:outputText value="#{order.status}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Details</f:facet>
                                <h:link outcome="orderDetails" value="View Details" />
                            </h:column>

                        </h:dataTable>
                    </div>

                </h:form>

            </section>

        </main>
    </h:body>

</html>
