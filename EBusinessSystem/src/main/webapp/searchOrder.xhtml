<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Search orders | SmartTech</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>
        <main class="app-container">
            <header class="app-header">
                <div>
                    <h1>SmartTech</h1>
                    <p>Order processing</p>
                </div>

                <nav class="app-nav" aria-label="Order navigation">
                    <h:link outcome="main" value="Dashboard" />
                    <h:link outcome="createOrder" value="Create order" />
                    <h:link outcome="listOrders" value="Orders" />
                    <h:link outcome="listCustomers" value="Customers" />
                    <h:form styleClass="logout-form">
                        <h:commandLink value="Sign out"
                                       action="#{authenticationBean.logout}"
                                       styleClass="nav-command-link" />
                    </h:form>
                </nav>
            </header>

            <section class="content-card">
                <div class="section-heading">
                    <h2>Search order records</h2>
                    <p>Find orders using an order ID, customer, email, product, quantity, status or note.</p>
                </div>

                <h:form id="searchOrderForm" styleClass="search-form">
                    <h:messages globalOnly="true" styleClass="form-error" />

                    <div class="search-bar">
                        <div class="form-group search-input-group">
                            <h:outputLabel for="searchKeyword" value="Search keyword" styleClass="form-label" />
                            <h:inputText id="searchKeyword"
                                         value="#{orderBean.searchKeyword}"
                                         styleClass="form-input" />
                            <h:message for="searchKeyword" styleClass="form-error" />
                        </div>

                        <div class="search-action">
                            <h:commandButton value="Search orders"
                                             action="#{orderBean.searchOrder}"
                                             styleClass="primary-button" />
                        </div>
                    </div>

                    <div class="table-wrapper">
                        <h:dataTable value="#{orderBean.filteredOrderRows}"
                                     var="order"
                                     styleClass="data-table">
                            <h:column>
                                <f:facet name="header">Order ID</f:facet>
                                <h:outputText value="#{order.orderId}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Customer</f:facet>
                                <h:outputText value="#{order.customerName}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Customer email</f:facet>
                                <h:outputText value="#{order.customerEmail}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Product type</f:facet>
                                <h:outputText value="#{order.productType}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Brand</f:facet>
                                <h:outputText value="#{order.brand}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Model</f:facet>
                                <h:outputText value="#{order.productModel}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Quantity</f:facet>
                                <h:outputText value="#{order.quantity}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Status</f:facet>
                                <h:outputText value="#{order.status}" />
                            </h:column>
                        </h:dataTable>
                    </div>

                    <div class="page-actions">
                        <h:link outcome="listOrders"
                                value="Back to orders"
                                styleClass="secondary-button" />
                    </div>
                </h:form>
            </section>
        </main>
    </h:body>

</html>
