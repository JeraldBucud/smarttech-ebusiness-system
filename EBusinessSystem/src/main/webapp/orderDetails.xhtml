<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

    <h:head>
        <title>Order Details - E-Business System</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>
        <main class="app-container">

            <header class="app-header">
                <div>
                    <h1>E-Business System</h1>
                    <p>Order Details</p>
                </div>

                <nav class="app-nav">
                    <h:link outcome="main" value="Dashboard" />
                    <h:link outcome="createOrder" value="Create Order" />
                    <h:link outcome="listOrders" value="List Orders" />
                    <h:link outcome="searchOrder" value="Search Order" />
                    
                    <h:form styleClass="logout-form">
                        <h:commandLink value="Logout"
                                       action="#{authenticationBean.logout}"
                                       styleClass="nav-command-link" />
                    </h:form>
                </nav>
            </header>

            <section class="content-card">

                <div class="section-heading">
                    <h2>Order Details</h2>
                    <p>
                        View the selected customer order, product information, quantity, and order status.
                    </p>
                </div>

                <div class="details-grid">

                    <div class="details-item">
                        <span class="details-label">Order ID</span>
                        <span class="details-value">
                            <h:outputText value="#{orderBean.selectedOrder.orderId}" />
                        </span>
                    </div>

                    <div class="details-item">
                        <span class="details-label">Order Status</span>
                        <span class="details-value">
                            <h:outputText value="#{orderBean.selectedOrder.status}" />
                        </span>
                    </div>

                    <div class="details-item">
                        <span class="details-label">Customer</span>
                        <span class="details-value">
                            <h:outputText value="#{orderBean.selectedOrder.customerName}" />
                        </span>
                    </div>

                    <div class="details-item">
                        <span class="details-label">Customer Email</span>
                        <span class="details-value">
                            <h:outputText value="#{orderBean.selectedOrder.customerEmail}" />
                        </span>
                    </div>

                    <div class="details-item">
                        <span class="details-label">Product Type</span>
                        <span class="details-value">
                            <h:outputText value="#{orderBean.selectedOrder.productType}" />
                        </span>
                    </div>

                    <div class="details-item">
                        <span class="details-label">Brand</span>
                        <span class="details-value">
                            <h:outputText value="#{orderBean.selectedOrder.brand}" />
                        </span>
                    </div>

                    <div class="details-item">
                        <span class="details-label">Product Model</span>
                        <span class="details-value">
                            <h:outputText value="#{orderBean.selectedOrder.productModel}" />
                        </span>
                    </div>

                    <div class="details-item">
                        <span class="details-label">Quantity</span>
                        <span class="details-value">
                            <h:outputText value="#{orderBean.selectedOrder.quantity}" />
                        </span>
                    </div>

                    <div class="details-item details-full">
                        <span class="details-label">Stock Impact</span>
                        <span class="details-value">
                            <h:outputText value="#{orderBean.selectedOrder.stockImpact}" />
                        </span>
                    </div>

                    <div class="details-item details-full">
                        <span class="details-label">Order Notes</span>
                        <span class="details-value">
                            <h:outputText value="#{orderBean.selectedOrder.orderNotes}" />
                        </span>
                    </div>
                    
                </div>

            </section>

        </main>
    </h:body>

</html>
