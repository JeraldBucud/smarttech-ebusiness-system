<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html">
          
    <h:head>
        <title>Account Recovery - E-Business System</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>
    
    <h:body>
        <main class="auth-container">
            <section class="auth-card">
                
                <div class="auth-brand">
                    <h2>E-business System</h2>
                    <p>Account Recovery Portal</p>
                </div>
                
                <h1 class="auth-title">Recover Your Account</h1>
                
                <p class="auth-subtitle">
                    Enter your registered email address to request an account recovery code.
                </p>
                
                <h:form styleClass="auth-form">
                    <div class="form-group">
                        <h:outputLabel for="email" value="Email Address" styleClass="form-label" />
                        <h:inputText id="email"
                                     required="true"
                                     requiredMessage="Email address is required."
                                     styleClass="form-input" />
                        <h:message for="email" styleClass="form-error" />                                       
                    </div>
                    
                    <div class="form-actions">
                        <h:commandButton value="Create Recovery Code" styleClass="primary=button" />
                    </div>
                    
                </h:form>
                
                <div class="auth-links">
                    <h:link outcome="login" value="Back to Login" />
                    <span>|</span>
                    <h:link outcome="index" value="Welcome Page" />
            </div>
                
            </section>
        </main>
    </h:body>
</html>
