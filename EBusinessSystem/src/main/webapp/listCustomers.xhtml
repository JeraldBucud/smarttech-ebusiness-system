<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Customers | SmartTech</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>
        <main class="app-container">

            <header class="app-header">
                <div>
                    <h1>SmartTech</h1>
                    <p>Customer records</p>
                </div>

                <nav class="app-nav" aria-label="Customer navigation">
                    <h:link outcome="main" value="Dashboard" />
                    <h:link outcome="createCustomer" value="Add customer" />
                    <h:link outcome="searchCustomer" value="Search" />
                    <h:form styleClass="logout-form">
                        <h:commandLink value="Sign out"
                                       action="#{authenticationBean.logout}"
                                       styleClass="nav-command-link" />
                    </h:form>
                </nav>
            </header>

            <section class="content-card">
                <div class="section-heading">
                    <h2>Customer directory</h2>
                    <p>Review customer contact records stored in the SmartTech workspace.</p>
                </div>

                <h:form styleClass="data-form">
                    <h:messages globalOnly="true" styleClass="form-error" />

                    <div class="table-wrapper">
                        <h:dataTable value="#{customerBean.customerRows}"
                                     var="customer"
                                     styleClass="data-table">

                            <h:column>
                                <f:facet name="header">Customer ID</f:facet>
                                <h:outputText value="#{customer.customerId}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">First name</f:facet>
                                <h:outputText value="#{customer.firstName}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Last name</f:facet>
                                <h:outputText value="#{customer.lastName}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Email address</f:facet>
                                <h:outputText value="#{customer.emailAddress}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Phone number</f:facet>
                                <h:outputText value="#{customer.phoneNumber}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Address</f:facet>
                                <h:outputText value="#{customer.address}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Profile</f:facet>
                                <h:link outcome="customerDetails" value="View profile" />
                            </h:column>

                        </h:dataTable>
                    </div>
                </h:form>

                <div class="page-actions">
                    <h:link outcome="createCustomer"
                            value="Add customer"
                            styleClass="primary-link-button" />
                </div>
            </section>

        </main>
    </h:body>

</html>
