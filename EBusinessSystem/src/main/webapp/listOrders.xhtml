<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Orders | SmartTech</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>
        <main class="app-container">
            <header class="app-header">
                <div>
                    <h1>SmartTech</h1>
                    <p>Order processing</p>
                </div>

                <nav class="app-nav" aria-label="Order navigation">
                    <h:link outcome="main" value="Dashboard" />
                    <h:link outcome="createOrder" value="Create order" />
                    <h:link outcome="searchOrder" value="Search" />
                    <h:link outcome="listCustomers" value="Customers" />
                    <h:form styleClass="logout-form">
                        <h:commandLink value="Sign out"
                                       action="#{authenticationBean.logout}"
                                       styleClass="nav-command-link" />
                    </h:form>
                </nav>
            </header>

            <section class="content-card">
                <div class="section-heading">
                    <h2>Order records</h2>
                    <p>Review SmartTech customer orders, quantities, product details and current status.</p>
                </div>

                <h:form>
                    <h:messages globalOnly="true" styleClass="form-error" />

                    <div class="table-wrapper">
                        <h:dataTable value="#{orderBean.orderRows}"
                                     var="order"
                                     styleClass="data-table">
                            <h:column>
                                <f:facet name="header">Order ID</f:facet>
                                <h:outputText value="#{order.orderId}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Customer</f:facet>
                                <h:outputText value="#{order.customerName}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Product type</f:facet>
                                <h:outputText value="#{order.productType}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Product model</f:facet>
                                <h:outputText value="#{order.productModel}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Quantity</f:facet>
                                <h:outputText value="#{order.quantity}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Status</f:facet>
                                <h:outputText value="#{order.status}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Details</f:facet>
                                <h:link outcome="orderDetails" value="View order">
                                    <f:param name="orderId" value="#{order.orderId}" />
                                </h:link>
                            </h:column>
                            <h:column>
                                <f:facet name="header">Action</f:facet>
                                <h:commandLink value="Delete"
                                               action="#{orderBean.deleteOrder(order.orderId)}"
                                               styleClass="danger-link" />
                            </h:column>
                        </h:dataTable>
                    </div>
                </h:form>

                <div class="page-actions">
                    <h:link outcome="createOrder"
                            value="Create order"
                            styleClass="primary-link-button" />
                </div>
            </section>
        </main>
    </h:body>

</html>
